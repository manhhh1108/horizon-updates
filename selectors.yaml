# CSS/XPath selectors and recognition regexes for ChatGPT and Grok.

# The UIs change often; edit this file (no code change needed) when they do.

# Selectors marked TODO must be verified against the real logged-in DOM.



chatgpt:

  url_new_chat: "https://chatgpt.com/"

  new_chat_button: "button[aria-label='New chat']"   # verified 2026-10-04

  # 2026-10-04, read off a logged-in page over CDP: ChatGPT removed

  # id="prompt-textarea" and nearly every data-testid the tool used to click.

  # Each entry below lists TODAY's shape first and the previous UI after it,

  # separated by commas — one CSS selector that matches whichever shape the

  # account happens to be served. Commas (not a YAML list) on purpose: a build

  # shipped before 2026-10-04 reads these entries as a single string, and the

  # "Kiểm tra cập nhật" button must never hand it something it cannot parse.

  #

  # composer: div[contenteditable][role=textbox] (2026-10-04)

  #           #prompt-textarea                   (2026-09-25)

  input_box: "div[contenteditable='true'][role='textbox'], #prompt-textarea, [data-testid='prompt-textarea'], form div[contenteditable='true']"

  # Extra shapes accepted as proof this browser is logged in. They are merged

  # INTO input_box rather than checked on their own: the signed-in check and

  # the send path must look for the same element. When they drifted apart on

  # 2026-10-04 a run passed the login check and then failed every script on a

  # 30-second click timeout, which is how it reached a customer.

  signed_in_markers: []

  # Visible proof of being logged OUT. Only these (or an /auth URL) may mark an

  # account as expired.

  logged_out_markers:

    - "[data-testid='login-button']"

    - "a[href*='/auth/login']"

    - "button[data-testid='mobile-login-button']"

  # Only exists once the composer has text. The composer form's submit button

  # IS the send button and reads the same in every language; aria-label='Send'

  # is English only, and a customer on another interface got the text typed in

  # and nothing sent.

  send_button: "form button[type='submit'], button[aria-label='Send'], button[data-testid='send-button'], #composer-submit-button"

  # Present while the reply streams, gone when it has finished.

  # aria-label='Stop' is English only, so the first shape carries the weight:

  # while a reply streams the composer form holds exactly one DISABLED button

  # (verified 2026-10-04 in all four states — idle+empty, text typed,

  # streaming, finished — 1 only while streaming). It matters that this works

  # through the file alone: builds already installed on customer machines have

  # no other way to tell a finished reply from a half-written one.

  # NOT svg.icon-primary-action, which also matches the idle Voice button and

  # would hang every step for the whole response timeout.

  stop_button: "form button[disabled], button[aria-label='Stop'], button[data-testid='stop-button']"

  # The reply's markdown body. The whole turn

  # ([data-chatgpt-search-unit-key*=':assistant']) works too, but its text

  # starts with the screen-reader label "ChatGPT said:".

  # The screen-reader heading is the ONLY marker an IMAGE turn shares
  # with a text turn (verified live 2026-10-05): an image turn has no
  # markdown root and no ":assistant" search-unit key, so a refusal on
  # one read as nothing at all and the step reported a blank.
  assistant_message: "div[data-markdown-text-style='assistant-message'], div:has(> h4[data-conversation-role='assistant']), [data-message-author-role='assistant']"

  file_download_link: "a[href*='sandbox']"   # unused: replies are forced to plain text

  # 2026-10-04: a generated image is a blob: <img> inside a

  # "generated-image-preview" button; the old /backend-api/estuary/content src

  # is gone. Both download the same way (BrowserSession.fetch_bytes reads blob:).

  generated_image: "button[data-testid='generated-image-preview'] img, img[alt*='Generated image' i], img[src*='/backend-api/estuary/content']"

  # The cookie banner overlays the bottom of the page (where the composer is).

  # Tried in order, best effort; text matches are language-dependent by nature.

  cookie_dismiss:

    - "button:has-text('Accept all')"

    - "button:has-text('Chấp nhận tất cả')"

    - "button[aria-label*='cookie' i]"

  # The composer's hidden photo <input> — files are set on it directly, with no

  # need to open the "+" menu. Used to attach a script's reference image(s).

  # accept="image/*" picks the photo input in any language; the aria-label

  # shapes are English only.

  attach_image_input: "form input[type='file'][accept='image/*'], input[type='file'][aria-label='Attach photos'], input[type='file'][aria-label='Attach photos or videos'], input[data-testid='upload-photos-input']"



grok:

  # Verified 2026-09-28 against a live CDP capture of grok.com/imagine in VIDEO

  # mode (tools/_capture_out/cand_grok_3.json + page_grok_3.html). Each selector

  # below matched exactly ONE element on that page.

  url_image_to_video: "https://grok.com/imagine"

  # The cookie banner overlays the bottom of the page (where the composer is),

  # so it is dismissed before anything is clicked.

  cookie_dismiss: "button[aria-label='Dismiss cookie notice']"

  # Imagine has an Image/Video/Agent radiogroup; the resolution + duration

  # controls only exist once Video is selected.

  video_mode_button: "button[role='radio'][aria-label='Video']"

  # /imagine has THREE file inputs; the first two belong to the Text Edit /

  # Precise Edit template cards and come earlier in the DOM, so a bare

  # "input[type=file]" picks the wrong one. Scope to the composer form's input.

  image_upload_input: "form input[type='file'][name='files']"

  # The composer is a ProseMirror contenteditable. The page's only <textarea> is

  # an aria-hidden, visibility:hidden measuring element — "textarea" pastes nowhere.

  motion_prompt_box: "[data-testid='chat-input'] div[contenteditable='true']"

  # 2026-09-30: Grok moved these from dropdowns to INLINE radio buttons in the

  # composer — role="radio", NO aria-label, the value is the button's text

  # ("6s"/"10s"/"15s", "480p"/"720p"). The old triggers match nothing now, so a

  # run silently kept Grok's defaults (480p/10s) while asking for 15s/720p.

  # Both shapes are supported: the inline option is tried first, and the

  # dropdown trigger below is used only if it is still there.

  option_button: "form button[role='radio']"

  # The buttons that OPEN the option menus. Their aria-labels are translated
  # (verified 2026-10-05 by flipping the browser's own i18nextLng to "vi"):
  #   Video duration   -> Thoi luong video
  #   Video resolution -> Do phan giai video
  #   Aspect Ratio     -> Ty le khung hinh
  # so the English shape alone found nothing on a Vietnamese account and the
  # render went ahead at Grok's defaults.
  #
  # The second branch reads no words at all. Each of the three menu buttons
  # shows its CURRENT value, and those are numbers in every language:
  #   resolution -> 480p / 720p / 1080p   (ends in p)
  #   duration   -> 6s / 10s / 15s        (ends in s)
  #   ratio      -> 2:3 / 16:9            (has a colon)
  # Exactly one of the three matches each shape, so no two can be confused.
  duration_control: "button[aria-label='Video duration'], form button[aria-haspopup='menu']:has-text('s')"

  quality_control: "button[aria-label='Video resolution'], form button[aria-haspopup='menu']:has-text('p')"

  # NOTE (smoke run 2026-09-28): this control DISAPPEARS once an image is

  # uploaded — with a first frame, Grok takes the ratio from the image. So it

  # only applies to text -> video, never to our image -> video flow.

  aspect_ratio_control: "button[aria-label='Aspect Ratio'], form button[aria-haspopup='menu']:has-text(':')"

  # Options inside an opened control dropdown, tried in order until one matches.

  # verified 2026-09-28 (--dump-menus, menu open): the items are

  # <div role="menuitemradio" aria-checked> inside a radix popper portal —

  # note [role='menuitem'] does NOT match role="menuitemradio" in CSS, which is

  # why the first smoke run silently kept Grok's defaults. Real labels:

  # duration = 6s / 10s / 15s, resolution = 480p / 720p / 1080p.

  # The rest are kept as fallbacks in case Grok changes the role.

  menu_item:

    - "[role='menuitemradio']"

    - "[role='menuitem']"

    - "[role='option']"

    - "[data-radix-collection-item]"

  # verified 2026-09-28 (smoke run): the composer grows a real submit button

  # once an image/prompt is present -> aria-label="Submit", type="submit".

  # Empty would fall back to pressing Enter in the composer (that works too).

  generate_button: "form button[type='submit'], button[aria-label='Submit']"

  # The rendered video. The sidebar history uses the SAME

  # assets.grok.com/users/…/generated/<id>/generated_video.mp4 URL shape, so it

  # has to be excluded — but scoping to <main> (what this used to do) only

  # works on the composer layout. After submitting, Grok can land on

  # /imagine/post/<id>, where <main> holds just the zoom control and the media

  # sits outside it: a finished video then matched NOTHING and the step waited

  # out the full render timeout (seen live 2026-09-29). Excluding the sidebar

  # by ancestor instead matches on both layouts.

  video_result: "xpath=//video[contains(@src,'/generated/')][not(ancestor::*[@data-sidebar])]"



# Recognition patterns (Python regex, case-insensitive at use site).

patterns:

  continue_marker: "\\[PART\\s+\\d+\\s+COMPLETE.*?CONTINUE.*?\\]"

  quota_exhausted:

    - "you've reached your.*limit"

    - "quota"

    - "try again later"

    # Grok Imagine does not say "quota": once the account's allowance is used up

    # it shows an upsell dialog instead (seen live 2026-09-30, while the step

    # waited 600s for a video that was never going to render).

    - "upgrade to supergrok"

    - "unlock your creativity with imagine"

    # ChatGPT announces a spent allowance in the UI rather than in a reply, and

    # words it several ways depending on what ran out. Missing it does not just

    # mislabel a step — it stops the account rotation from firing at all.

    # TODO: kiểm tra chữ thực tế — none of these has been seen live yet; when a

    # real limit message appears, copy its wording in and drop what does not fit.

    - "you(’|')?ve (hit|reached) the .{0,30}limit"

    - "limit reached"

    - "upgrade to (chatgpt )?(plus|pro|go)"

    - "you(’|')?ll be able to .{0,20}again (after|at|in)"

    - "image generation limit"

    # Giao diện tiếng Việt (khách dùng bản này). Mỗi mẫu phải ĐỦ CỤ THỂ để

    # không khớp vào chính câu chuyện — quota được dò trên toàn bộ nội dung

    # trả lời. Chưa thấy chữ thật, nên nếu khách chụp được màn hình báo hết

    # lượt thì chép đúng chữ đó vào đây và bỏ mẫu nào không đúng.

    - "nâng cấp lên (chatgpt )?(plus|pro|go)"


    - "giới hạn (tin nhắn|tạo ảnh)"
    # Grok Imagine, read off the live canvas 2026-10-05 once the account ran
    # out of credits mid-render. "gioi han su dung" (usage limit) and "them
    # tin dung" (add credits) are interface wording; a story can use the word
    # "gioi han" on its own all it likes without tripping these.
    - "giới hạn sử dụng"
    - "thêm tín dụng"
    - "usage limit"
    - "add credits"

    # KHONG them mau tieng Viet chung chung ("giới hạn", "hết lượt"): quota duoc

    # do tren TOAN BO noi dung tra loi, tuc la ca cau chuyen — mot cau van binh

    # thuong nhu "Cô ấy đã chạm tới giới hạn của sự chịu đựng" se bi coi la het

    # quota va lam xoay vong tai khoan oan.

  policy_refusal:

    - "I can't help with that"

    - "against.*content policy"

    - "unable to generate this image"
    # Read off the live refusal 2026-10-05 (ChatGPT in Vietnamese):
    # "Rat tiec, nhung hinh anh chung ta tao ra co the vi pham cac quy
    #  dinh cua chung toi ve bao luc ... chinh sua cau lenh cua ban."
    - "vi phạm các quy định"
    - "chỉnh sửa câu lệnh"
    - "violate our (content )?polic"

  video_error:

    # Keep these specific: a bare "try again" would also match the

    # quota_exhausted "try again later" and misclassify a quota case.

    - "something went wrong"

    - "failed to generate"

    - "render failed"

    - "unable to create the video"

  # NOTE: these patterns are matched against the assistant response text, which

  # for a script IS the (long) story — keep them specific so ordinary story

  # wording never trips them (a bare "log in" would). Ideally, when tuning

  # against the live site, point these at a login/error banner element instead

  # of the message body (same applies to quota_exhausted / policy_refusal).

  session_expired:

    - "please log in"

    - "log in to continue"

    - "sign in to continue"

    - "you(’|')?ve been logged out"

    - "session (has )?expired"

    - "vui lòng đăng nhập"

    - "đăng nhập để tiếp tục"

    - "phiên.{0,15}hết hạn"



# Section heading regexes (matched on a stripped line, IGNORECASE).

# Order = canonical section order (1..9).

section_headings:

  # The (?-i:[^a-z]*)$ tail requires the rest of the line after the heading

  # keyword to contain no lowercase letters, so a story sentence that merely

  # starts with e.g. "IMAGE PROMPT was ..." is not mistaken for a heading,

  # while real headings ("IMAGE PROMPT — 9:16", "KEY SCENES + NOTE") still match.

  full_story: "^#*\\s*\\**\\s*(\\d+[\\.\\)]\\s*)?FULL STORY(?-i:[^a-z]*)$"

  key_scenes: "^#*\\s*\\**\\s*(\\d+[\\.\\)]\\s*)?KEY SCENES(?-i:[^a-z]*)$"

  image_9x16: "^#*\\s*\\**\\s*(\\d+[\\.\\)]\\s*)?IMAGE PROMPT(?-i:[^a-z]*)$"

  thumbnail_16x9: "^#*\\s*\\**\\s*(\\d+[\\.\\)]\\s*)?THUMBNAIL(?-i:[^a-z]*)$"

  video_prompt: "^#*\\s*\\**\\s*(\\d+[\\.\\)]\\s*)?VIDEO AI PROMPT(?-i:[^a-z]*)$"

  fb_title: "^#*\\s*\\**\\s*(\\d+[\\.\\)]\\s*)?FACEBOOK TITLE(?-i:[^a-z]*)$"

  fb_description: "^#*\\s*\\**\\s*(\\d+[\\.\\)]\\s*)?FACEBOOK VIDEO DESCRIPTION(?-i:[^a-z]*)$"

  story_teaser: "^#*\\s*\\**\\s*(\\d+[\\.\\)]\\s*)?STORY TEASER(?-i:[^a-z]*)$"

  hashtags: "^#*\\s*\\**\\s*(\\d+[\\.\\)]\\s*)?HASHTAGS(?-i:[^a-z]*)$"

